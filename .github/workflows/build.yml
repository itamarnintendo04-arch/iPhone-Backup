name: Build desktop apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Package standalone desktop application
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name IPHONE-BACKUP
          --collect-all customtkinter
          --collect-all pymobiledevice3
          app.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPHONE-BACKUP-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
